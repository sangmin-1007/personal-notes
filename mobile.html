<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131722"><title>상민의 메모 · 모바일</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--text:#1e2430;--muted:#7b8494;--line:#e3e6ed;--primary:#555fe7;--soft:#eef0ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:750px;margin:auto;min-height:100dvh;padding:0 16px 104px}.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;background:var(--bg)}.brand{font-size:19px;font-weight:800;letter-spacing:-.5px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:11px 14px;color:var(--text);font-weight:650}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.iconbtn{border:0;background:transparent;color:var(--text);padding:9px;font-size:20px}.pagehead{margin:24px 0 16px}.pagehead h1{font-size:27px;letter-spacing:-.9px;margin:0 0 8px}.pagehead p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 16px;outline:none}.actions{display:flex;gap:8px;align-items:center;margin:16px 0}.note{display:flex;text-align:left;width:100%;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:10px 0}.note .emoji{font-size:25px}.note .main{flex:1;min-width:0}.note b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note small{display:block;margin-top:7px;color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.field{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:6px}.control{width:100%;min-height:44px;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text)}textarea.control{resize:vertical;line-height:1.5}.note-title{font-size:25px;font-weight:800;min-height:55px}.episode-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.episode-top strong{font-size:16px}.ep-number{font-size:12px;color:var(--muted)}.episode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.span2{grid-column:1 / -1}.checkrow{display:flex;align-items:center;gap:10px;font-size:14px}.checkrow input{height:21px;width:21px;accent-color:var(--primary)}.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.section summary{cursor:pointer;list-style:none;padding:17px;display:flex;gap:9px;align-items:center}.section summary::-webkit-details-marker{display:none}.section summary b{flex:1}.section summary small{color:var(--muted)}.section summary:after{content:'⌄';font-size:21px;color:var(--muted)}.section[open] summary:after{content:'⌃'}.section-body{padding:0 11px 5px}.section .card{box-shadow:none;background:var(--bg)}.progress{height:9px;background:var(--line);overflow:hidden;border-radius:20px}.progress div{height:100%;background:var(--primary);width:0}.progressline{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--muted);font-size:13px}.sticky{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}.sticky button{flex:1;max-width:350px}.hidden{display:none!important}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#202638;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-size:13px;max-width:95%;white-space:nowrap}.empty{color:var(--muted);text-align:center;padding:50px 12px}.rich{line-height:1.6;min-height:150px;outline:none;overflow-wrap:anywhere}.rich img{max-width:100%}.rich table{display:block;overflow:auto;max-width:100%}.rich input{max-width:100%}.rich p{margin:0 0 8px}
</style></head><body><div class="shell"><header class="bar"><div class="brand" id="brand">📓 상민의 메모 <span class="muted" style="font-size:11px">MOBILE</span></div><button class="btn" id="pc">PC 버전 ↗</button></header><main id="view"></main></div><footer class="sticky hidden" id="sticky"><button class="btn" id="back">← 목록</button><button class="btn primary" id="save">변경사항 저장</button></footer><div class="toast hidden" id="toast"></div>
<script>
const API='https://personal-notes-api.vercel.app/api/notes',MONO='monogatari-watch-checklist-20261115';
const $=s=>document.querySelector(s),el=(tag,cls,text)=>{let n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n};
let db={pages:[]},original=null,current=null,dirty=false,loading=false,search='',filter='all',timer;
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>t.classList.add('hidden'),2500)}
function setDirty(){dirty=true;$('#save').textContent='변경사항 저장 ●'}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function safe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error(r.status);db=await r.json();original=JSON.stringify(db);render();}catch(e){toast('메모를 불러오지 못했어. 새로고침해줘.');$('#view').innerHTML='<p class="empty">연결을 확인하고 새로고침해 주세요.</p>'}}
function meta(p){return p?.updated?new Date(p.updated).toLocaleDateString('ko-KR'):''}
function render(){const v=$('#view');v.innerHTML='';$('#sticky').classList.toggle('hidden',!current);if(!current){home(v);return}const p=db.pages.find(x=>x.id===current);if(!p){current=null;return render()}editor(v,p)}
function home(v){const h=el('div','pagehead');h.innerHTML='<h1>나의 메모</h1><p>메모와 감상 기록을 한곳에서 관리해요.</p>';v.append(h);const q=el('input','search');q.placeholder='메모 제목 검색';q.value=search;q.oninput=()=>{search=q.value;list.replaceChildren();fillList(list)};v.append(q);const a=el('div','actions');const add=el('button','btn primary','＋ 새 메모');add.onclick=()=>{let t=Date.now(),p={id:id(),title:'새 메모',body:'',blocks:[{id:id(),type:'text',text:'',html:''}],created:t,updated:t};db.pages.unshift(p);current=p.id;setDirty();render()};a.append(add);v.append(a);const list=el('div');v.append(list);fillList(list)}
function fillList(box){const ps=(db.pages||[]).filter(p=>(p.title||'').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(b.updated||0)-(a.updated||0));if(!ps.length){box.innerHTML='<div class="empty">메모가 없습니다.</div>';return}ps.forEach(p=>{let b=el('button','note');b.innerHTML='<span class="emoji">'+(p.id===MONO?'🎬':'📝')+'</span><span class="main"><b>'+safe(p.title)+'</b><small>'+meta(p)+'</small></span><span class="muted">›</span>';b.onclick=()=>{current=p.id;render();scrollTo(0,0)};box.append(b)})}
function editor(v,p){const head=el('div','pagehead');const title=el('input','control note-title');title.value=p.title||'';title.oninput=()=>{p.title=title.value;p.updated=Date.now();setDirty()};head.append(title);const sub=el('p','',p.id===MONO?'화별 감상 체크리스트 · 이어보기 기록':'작성 및 수정 '+meta(p));head.append(sub);v.append(head);
if(p.id===MONO){watch(v,p)}else{regular(v,p)}}
function regular(v,p){(p.blocks||[]).forEach((b,i)=>{const box=el('div','card');if(b.type==='image'){const im=el('img');im.src=b.url||b.data;im.style.maxWidth='100%';box.append(im)}else{const rich=el('div','rich');rich.contentEditable='true';rich.innerHTML=b.html||safe(b.text||'').replace(/\n/g,'<br>');rich.oninput=()=>{b.html=rich.innerHTML;b.text=rich.innerText;p.updated=Date.now();setDirty()};box.append(rich)}v.append(box)});let add=el('button','btn','＋ 글 블록 추가');add.onclick=()=>{p.blocks.push({id:id(),type:'text',text:'',html:''});setDirty();render()};v.append(add)}
function watch(v,p){const b=p.blocks.find(x=>x.type==='text');if(!b){v.append(el('p','empty','표 데이터가 없어.'));return}const doc=new DOMParser().parseFromString(b.html||'','text/html');const trs=[...doc.querySelectorAll('tbody tr')];if(!trs.length){v.append(el('p','empty','감상표를 찾지 못했어.'));return}
const stats=el('div','card');v.append(stats);
const entries=trs.map((tr,i)=>{const cells=[...tr.querySelectorAll('td')];return{tr,cells,i,series:cells[2]?.textContent.trim()||'시리즈',ep:cells[3]?.textContent.trim()||'',cb:cells[0]?.querySelector('input'),sel:cells[4]?.querySelector('select'),time:cells[5]?.querySelector('input'),memo:cells[6]?.querySelector('input')}});
const groups=new Map;entries.forEach(x=>{if(!groups.has(x.series))groups.set(x.series,[]);groups.get(x.series).push(x)});
function refresh(){const done=entries.filter(x=>x.cb?.checked).length;stats.innerHTML='<div style="font-weight:750;margin-bottom:10px">전체 감상 진행률</div><div class="progress"><div style="width:'+done/entries.length*100+'%"></div></div><div class="progressline"><span>완료 '+done+' / '+entries.length+'화</span><b>'+Math.round(done/entries.length*100)+'%</b></div>';v.querySelectorAll('[data-group]').forEach(s=>{let xs=groups.get(s.dataset.group)||[];s.querySelector('small').textContent=xs.filter(x=>x.cb?.checked).length+' / '+xs.length+' 완료'})}
function changed(x){const checked=x.cb?.checked;if(x.cb){if(checked)x.cb.setAttribute('checked','');else x.cb.removeAttribute('checked')}if(x.sel){[...x.sel.options].forEach(o=>{if(o.selected)o.setAttribute('selected','');else o.removeAttribute('selected')})}if(x.time)x.time.setAttribute('value',x.time.value);if(x.memo)x.memo.setAttribute('value',x.memo.value);b.html=doc.body.innerHTML;b.text='모노가타리 감상표';p.updated=Date.now();setDirty();refresh()}
for(const [name,xs] of groups){let details=el('details','section');details.dataset.group=name;details.open=xs.some(x=>x.sel?.value==='시청중')||[...groups.keys()][0]===name;const summary=el('summary');summary.innerHTML='<b>'+safe(name)+'</b><small></small>';details.append(summary);const body=el('div','section-body');details.append(body);v.append(details);
for(const x of xs){const card=el('div','card');const top=el('div','episode-top');const strong=el('strong','',x.ep);top.append(strong);const check=el('label','checkrow');const cb=el('input');cb.type='checkbox';cb.checked=!!x.cb?.checked;check.append(cb,el('span','', '완료'));top.append(check);card.append(top);
const g=el('div','episode-grid');
const makeField=(name,node,span=false)=>{const wrap=el('div',span?'span2':'');wrap.append(el('label','field',name),node);g.append(wrap);return node};
const sel=el('select','control');['미시청','시청중','완료'].forEach(s=>{const opt=el('option','',s);opt.value=s;sel.append(opt)});sel.value=x.sel?.value||'미시청';
const time=el('input','control');time.type='text';time.placeholder='예: 12:35';time.inputMode='numeric';time.value=x.time?.getAttribute('value')||'';
const memo=el('textarea','control');memo.rows=2;memo.placeholder='감상 메모';memo.value=x.memo?.getAttribute('value')||'';
makeField('감상 상태',sel);makeField('중단 시점 (분:초)',time);makeField('비고',memo,true);card.append(g);body.append(card);
function update(){if(x.cb)x.cb.checked=cb.checked;if(x.sel)x.sel.value=sel.value;if(x.time)x.time.value=time.value;if(x.memo)x.memo.value=memo.value;changed(x)}
cb.onchange=()=>{sel.value=cb.checked?'완료':'미시청';update()};sel.onchange=()=>{cb.checked=sel.value==='완료';update()};time.oninput=update;memo.oninput=update;
}
}refresh()}
async function save(){if(loading||!dirty){toast('저장할 변경사항이 없어.');return}loading=true;$('#save').disabled=true;$('#save').textContent='저장 중...';try{const p=db.pages.find(x=>x.id===current);if(!p)throw Error('Missing note');p.updated=Date.now();p.body=(p.blocks||[]).filter(b=>b.type==='text').map(b=>b.text||'').join('\n');const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(!r.ok)throw Error(r.status);db=await r.json();original=JSON.stringify(db);dirty=false;toast('저장 완료! PC와 동기화됐어.');render()}catch(e){toast('저장 실패. 다시 시도해줘.')}finally{loading=false;$('#save').disabled=false;$('#save').textContent=dirty?'변경사항 저장 ●':'변경사항 저장'}}
function back(){if(dirty&&!confirm('저장되지 않은 변경사항이 있어. 저장하지 않고 목록으로 갈까?'))return;if(dirty&&original)db=JSON.parse(original);dirty=false;current=null;render();scrollTo(0,0)}
$('#pc').onclick=()=>location.href='./';$('#brand').onclick=()=>{if(!current)return;back()};$('#back').onclick=back;$('#save').onclick=save;
load();
</script></body></html>
