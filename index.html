<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Notes</title>
<style>:root{--bg:#fff;--panel:#f7f7f5;--text:#37352f;--muted:#787774;--line:#e9e9e7;--hover:#efefed;--danger:#e03e3e}[data-theme=dark]{--bg:#191919;--panel:#202020;--text:#e6e6e4;--muted:#9b9b98;--line:#333;--hover:#2c2c2c;--danger:#ff7369}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:260px 1fr}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:700}.dot{width:24px;height:24px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px}.actions{padding:6px 8px}.sidebtn{width:100%;border:0;background:transparent;border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer}.sidebtn:hover{background:var(--hover)}.search{padding:6px 10px}.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;outline:none}.label{padding:12px 14px 5px;color:var(--muted);font-size:12px;font-weight:600}#pages{padding:0 8px;overflow:auto;flex:1}.row{display:flex;align-items:center;border-radius:6px}.row:hover,.row.active{background:var(--hover)}.select{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.del{opacity:0;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:5px 8px}.row:hover .del{opacity:1}.del:hover{color:var(--danger)}.footer{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px}.footer button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px;cursor:pointer}main{min-width:0;overflow:auto}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;background:var(--bg);z-index:2}.crumb{font-size:14px}.state{font-size:12px;color:var(--muted)}.editor{max-width:900px;margin:auto;padding:70px 70px 120px}.title{width:100%;border:0;outline:0;background:transparent;font-size:40px;font-weight:750;letter-spacing:-1.2px;padding:0;margin:0 0 22px}.body{width:100%;min-height:60vh;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.8;padding:0;overflow:hidden}.empty{height:calc(100vh - 52px);display:grid;place-items:center;color:var(--muted);text-align:center}.empty button{margin-top:12px;border:0;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:7px}.hidden{display:none!important}.menu{display:none;border:0;background:transparent;font-size:20px}@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 20% 0 0;z-index:5;box-shadow:8px 0 30px #0003;transform:translateX(-105%);transition:.2s}.app.open aside{transform:none}.editor{padding:48px 24px 90px}.title{font-size:32px}.menu{display:block}}</style></head><body>
<div class="app" id="app"><aside><div class="brand"><div class="dot">N</div><span>상민의 메모</span></div><div class="actions"><button class="sidebtn" id="new">＋ 새 페이지</button></div><div class="search"><input id="search" placeholder="페이지 검색..."></div><div class="label">PRIVATE · GITHUB SYNC</div><div id="pages"></div><div class="footer"><button id="export">내보내기</button><button id="theme">다크 모드</button></div></aside><main><div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="menu" id="menu">☰</button><div class="crumb" id="crumb">Personal Notes</div></div><div class="state" id="state">연결 중...</div></div><section class="editor" id="editor"><input class="title" id="title" placeholder="제목 없음"><textarea class="body" id="body" placeholder="내용을 입력하세요..."></textarea></section><section class="empty hidden" id="empty"><div>페이지가 없습니다.<br><button id="emptyNew">새 페이지 만들기</button></div></section></main></div>
<script>
const API='https://personal-notes-api.vercel.app/api/notes',KEY='personal-notes-v1',THEME='personal-notes-theme',$=s=>document.querySelector(s);let data=local(),current=data.current||data.pages[0]?.id||null,timer,syncTimer,loaded=false;function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function seed(){return{current:null,pages:[]}}function local(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function cache(){data.current=current;localStorage.setItem(KEY,JSON.stringify(data))}async function remoteLoad(){try{$('#state').textContent='동기화 중...';let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let remote=await r.json();if(remote.pages?.length||!data.pages.length){data=remote;current=data.current||data.pages[0]?.id||null;cache()}else{await remoteSave()}loaded=true;render();$('#state').textContent='GitHub 동기화됨'}catch(e){loaded=true;render();$('#state').textContent='오프라인 · 로컬 저장';console.error(e)}}async function remoteSave(){cache();$('#state').textContent='저장 중...';try{let r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('HTTP '+r.status);let saved=await r.json();data=saved;current=data.current||current;cache();$('#state').textContent='GitHub 저장됨'}catch(e){$('#state').textContent='동기화 실패 · 로컬 저장';console.error(e)}}function save(){cache();clearTimeout(syncTimer);syncTimer=setTimeout(remoteSave,700)}function page(){return data.pages.find(p=>p.id===current)}function list(q=''){let box=$('#pages');box.innerHTML='';data.pages.filter(p=>(p.title||'제목 없음').toLowerCase().includes(q.toLowerCase())||(p.body||'').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.updated-a.updated).forEach(p=>{let r=document.createElement('div');r.className='row'+(p.id===current?' active':'');let b=document.createElement('button');b.className='select';b.textContent='📄 '+(p.title.trim()||'제목 없음');b.onclick=()=>{current=p.id;cache();render();$('#app').classList.remove('open')};let d=document.createElement('button');d.className='del';d.textContent='×';d.onclick=e=>{e.stopPropagation();if(confirm('이 페이지를 삭제할까요?')){data.pages=data.pages.filter(x=>x.id!==p.id);if(current===p.id)current=data.pages[0]?.id||null;save();render()}};r.append(b,d);box.append(r)})}function grow(){let b=$('#body');b.style.height='auto';b.style.height=Math.max(b.scrollHeight,500)+'px'}function render(){let p=page();$('#editor').classList.toggle('hidden',!p);$('#empty').classList.toggle('hidden',!!p);if(p){$('#title').value=p.title;$('#body').value=p.body;$('#crumb').textContent=p.title||'제목 없음';grow()}else $('#crumb').textContent='Personal Notes';list($('#search').value)}function add(){let p={id:uid(),title:'',body:'',updated:Date.now()};data.pages.push(p);current=p.id;save();render();$('#title').focus()}function change(){let p=page();if(!p)return;p.title=$('#title').value;p.body=$('#body').value;p.updated=Date.now();$('#crumb').textContent=p.title||'제목 없음';$('#state').textContent='저장 중...';clearTimeout(timer);timer=setTimeout(()=>{save();list($('#search').value)},250);grow()}$('#new').onclick=add;$('#emptyNew').onclick=add;$('#title').oninput=change;$('#body').oninput=change;$('#search').oninput=e=>list(e.target.value);$('#menu').onclick=()=>$('#app').classList.toggle('open');function themeLabel(){$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'라이트 모드':'다크 모드'}$('#theme').onclick=()=>{let dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME,dark?'light':'dark');themeLabel()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-notes-backup.json';a.click();URL.revokeObjectURL(a.href)};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';themeLabel();render();remoteLoad();
</script></body></html>
