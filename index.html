<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Notes</title><style>:root{--bg:#fff;--panel:#f7f7f5;--text:#37352f;--muted:#787774;--line:#e9e9e7;--hover:#efefed}[data-theme=dark]{--bg:#191919;--panel:#202020;--text:#e6e6e4;--muted:#9b9b98;--line:#333;--hover:#2c2c2c}*{box-sizing:border-box}html,body{height:100%;margin:0}body,button,input,textarea{font-family:Inter,"Segoe UI","Noto Sans KR",sans-serif;color:var(--text)}body{background:var(--bg)}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:260px 1fr}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{height:52px;padding:0 14px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}.dot{width:24px;height:24px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center}.actions,.search{padding:6px 8px}.sidebtn,.select,.del{border:0;background:transparent}.sidebtn{width:100%;padding:8px 10px;text-align:left;border-radius:6px}.sidebtn:hover,.row:hover,.row.active{background:var(--hover)}.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:0}.label{padding:12px 14px 5px;font-size:12px;color:var(--muted)}#pages{padding:0 8px;overflow:auto;flex:1}.row{display:flex;border-radius:6px}.select{flex:1;text-align:left;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.del{padding:5px 8px;color:var(--muted);opacity:0}.row:hover .del{opacity:1}.footer{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px}.footer button{flex:1;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}main{overflow:auto}.top{height:52px;position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topleft,.topright{display:flex;align-items:center;gap:10px}.state,.meta,.hint{font-size:12px;color:var(--muted)}.savebtn{border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:7px;padding:7px 13px;font-weight:650}.savebtn:disabled{opacity:.45}.backbtn{border:0;background:transparent;padding:7px 9px}.editor,.home{max-width:900px;margin:auto;padding:70px 70px 120px}.title{width:100%;border:0;outline:0;background:transparent;font-size:40px;font-weight:750;padding:0;margin-bottom:8px}.meta{margin-bottom:25px}.blocks{min-height:420px}.block{margin:0}.textblock{display:block;width:100%;height:29px;min-height:29px;border:0;outline:0;resize:none;overflow:hidden;background:transparent;font-size:16px;line-height:25px;padding:2px 0;margin:0}.imageblock{position:relative;margin:14px 0 18px}.imageblock img{display:block;max-width:100%;max-height:650px;border-radius:8px}.remove{position:absolute;right:8px;top:8px;border:0;border-radius:6px;background:#000a;color:#fff;padding:5px 9px}.after{display:block;border:0;background:transparent;color:var(--muted);padding:7px 0}.toolbar{display:flex;gap:8px;align-items:center;margin-top:18px}.attach{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 11px}.home #homeNew{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:8px 12px;font-weight:600}.home #homeNew:hover{background:var(--hover)}.home h1{font-size:34px;margin-bottom:10px}.home p{color:var(--muted)}.hidden{display:none!important}.menu{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 20% 0 0;z-index:5;transform:translateX(-105%);background:var(--panel)}.app.open aside{transform:none}.editor,.home{padding:48px 24px}.menu{display:block}.state,.hint{display:none}}</style></head><body><div class="app" id="app"><aside><div class="brand" id="brand"><div class="dot">N</div>상민의 메모</div><div class="actions"><button class="sidebtn" id="new">＋ 새 페이지</button></div><div class="search"><input id="search" placeholder="페이지 검색..."></div><div class="label">PRIVATE · MANUAL SYNC</div><div id="pages"></div><div class="footer"><button id="export">내보내기</button><button id="theme">다크 모드</button></div></aside><main><div class="top"><div class="topleft"><button class="menu" id="menu">☰</button><button class="backbtn hidden" id="back">← 뒤로가기</button><span id="crumb">Personal Notes</span></div><div class="topright"><span class="state" id="state">불러오는 중...</span><button class="savebtn hidden" id="save" disabled>저장</button></div></div><section class="home" id="home"><h1>상민의 메모</h1><p>왼쪽에서 메모를 선택하거나 새 페이지를 만들어 시작하세요.</p><button id="homeNew">＋ 새 페이지</button></section><section class="editor hidden" id="editor"><input class="title" id="title" placeholder="제목 없음"><div class="meta" id="meta"></div><div class="blocks" id="blocks"></div><div class="toolbar"><button class="attach" id="attach">📎 현재 위치에 이미지</button><span class="hint">Enter로 새 줄 · Backspace로 줄 합치기/삭제 · Ctrl+V 이미지 삽입</span><input id="file" type="file" accept="image/*" multiple hidden></div></section></main></div><script>
const API='https://personal-notes-api.vercel.app/api/notes',IMGAPI='https://personal-notes-api.vercel.app/api/images',KEY='personal-notes-v1',DIRTY='personal-notes-dirty',THEME='personal-notes-theme',$=s=>document.querySelector(s);let data=load(),current=null,saving=false,snapshot=null,active=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function load(){try{return JSON.parse(localStorage.getItem(KEY))||{pages:[]}}catch{return{pages:[]}}}function cp(x){return JSON.parse(JSON.stringify(x))}function cache(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn(e)}}function isDirty(){return localStorage.getItem(DIRTY)==='1'}function dirty(v=true){localStorage.setItem(DIRTY,v?'1':'0');$('#save').disabled=!v||saving;$('#state').textContent=v?'저장되지 않은 변경사항':'GitHub와 동기화됨'}function norm(){(data.pages||=[]).forEach(p=>{p.created=p.created||p.updated||Date.now();p.updated=p.updated||p.created;if(!Array.isArray(p.blocks)){p.blocks=[];if(p.body)p.blocks.push({id:uid(),type:'text',text:p.body});(p.images||[]).forEach(x=>p.blocks.push({...x,id:x.id||uid(),type:'image'}));if(!p.blocks.length)p.blocks=[{id:uid(),type:'text',text:''}]}})}function page(){return data.pages.find(x=>x.id===current)}function touch(p){p.updated=Date.now();cache();dirty();$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;list($('#search').value)}function fmt(t){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}function grow(t){t.style.height='auto';t.style.height=Math.max(29,t.scrollHeight)+'px'}
async function remoteLoad(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error(r.status);let x=await r.json();snapshot=cp(x);if(!isDirty())data=x;norm();cache();showHome();dirty(isDirty())}catch(e){norm();showHome();$('#state').textContent='불러오기 실패 · 로컬 데이터 표시'}}
function searchText(p){return(p.title||'')+' '+(p.blocks||[]).filter(x=>x.type==='text').map(x=>x.text).join(' ')}function list(q=''){let box=$('#pages');box.innerHTML='';data.pages.filter(p=>searchText(p).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.updated-a.updated).forEach(p=>{let r=document.createElement('div');r.className='row'+(p.id===current?' active':'');let b=document.createElement('button');b.className='select';b.textContent='📄 '+(p.title||'제목 없음');b.onclick=()=>{current=p.id;render()};let d=document.createElement('button');d.className='del';d.textContent='×';d.onclick=e=>{e.stopPropagation();if(confirm('이 페이지를 삭제할까요?')){data.pages=data.pages.filter(x=>x.id!==p.id);touch(p);current===p.id?showHome():list(q)}};r.append(b,d);box.append(r)})}
function focus(id,pos){let t=document.querySelector(`[data-id="${id}"] textarea`);if(t){t.focus();let n=pos==null?t.value.length:pos;t.setSelectionRange(n,n)}}
function keydown(e,p,b,i,t){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();let s=t.selectionStart,en=t.selectionEnd,nb={id:uid(),type:'text',text:t.value.slice(en)};b.text=t.value.slice(0,s);p.blocks.splice(i+1,0,nb);active=nb.id;touch(p);renderBlocks(p);setTimeout(()=>focus(nb.id,0));return}if(e.key==='Backspace'&&t.selectionStart===0&&t.selectionEnd===0&&i>0){e.preventDefault();let prev=p.blocks[i-1];if(prev.type==='text'){let pos=(prev.text||'').length;prev.text=(prev.text||'')+(b.text||'');p.blocks.splice(i,1);active=prev.id;touch(p);renderBlocks(p);setTimeout(()=>focus(prev.id,pos))}else if((b.text||'')===''){p.blocks.splice(i,1);active=null;touch(p);renderBlocks(p)}return}if(e.key==='Delete'&&t.selectionStart===t.value.length&&t.selectionEnd===t.value.length&&i<p.blocks.length-1){let next=p.blocks[i+1];if(next.type==='text'){e.preventDefault();let pos=t.value.length;b.text=t.value+(next.text||'');p.blocks.splice(i+1,1);active=b.id;touch(p);renderBlocks(p);setTimeout(()=>focus(b.id,pos))}}}
function renderBlocks(p){let root=$('#blocks');root.innerHTML='';p.blocks.forEach((b,i)=>{if(b.type==='text'){let w=document.createElement('div');w.className='block';w.dataset.id=b.id;let t=document.createElement('textarea');t.className='textblock';t.value=b.text||'';t.placeholder=i===0?'내용을 입력하세요...':'';t.onfocus=()=>active=b.id;t.oninput=()=>{b.text=t.value;touch(p);grow(t)};t.onkeydown=e=>keydown(e,p,b,i,t);t.onpaste=e=>pasteImage(e,p,b,i,t);w.append(t);root.append(w);grow(t)}else{let w=document.createElement('div');w.className='imageblock';w.dataset.id=b.id;let img=document.createElement('img');img.src=b.data||b.url;img.onclick=()=>window.open(img.src,'_blank');let x=document.createElement('button');x.className='remove';x.textContent='삭제';x.onclick=()=>{p.blocks.splice(i,1);if(!p.blocks.length)p.blocks=[{id:uid(),type:'text',text:''}];touch(p);renderBlocks(p)};let a=document.createElement('button');a.className='after';a.textContent='＋ 이미지 아래에 글쓰기';a.onclick=()=>{let n={id:uid(),type:'text',text:''};p.blocks.splice(i+1,0,n);active=n.id;touch(p);renderBlocks(p);setTimeout(()=>focus(n.id,0))};w.append(img,x,a);root.append(w)}})}
function showHome(){current=active=null;$('#editor').classList.add('hidden');$('#home').classList.remove('hidden');$('#back').classList.add('hidden');$('#save').classList.add('hidden');$('#crumb').textContent='Personal Notes';list($('#search').value)}function render(){let p=page();if(!p)return showHome();$('#home').classList.add('hidden');$('#editor').classList.remove('hidden');$('#back').classList.remove('hidden');$('#save').classList.remove('hidden');$('#title').value=p.title||'';$('#crumb').textContent=p.title||'제목 없음';$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;renderBlocks(p);list($('#search').value);$('#save').disabled=!isDirty()||saving}function add(){let n=Date.now(),b={id:uid(),type:'text',text:''},p={id:uid(),title:'',body:'',blocks:[b],created:n,updated:n};data.pages.push(p);current=p.id;active=b.id;touch(p);render();$('#title').focus()}
function prep(f){return new Promise((ok,no)=>{let r=new FileReader;r.onerror=no;r.onload=()=>{let im=new Image;im.onerror=no;im.onload=()=>{let m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.84))};im.src=r.result};r.readAsDataURL(f)})}async function imgs(fs){let a=[];for(let f of [...fs].filter(f=>f.type?.startsWith('image/')))a.push({id:uid(),type:'image',name:f.name||'이미지',data:await prep(f),created:Date.now()});return a}async function pasteImage(e,p,b,i,t){let fs=[...(e.clipboardData?.items||[])].filter(x=>x.type?.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(!fs.length)return;e.preventDefault();let s=t.selectionStart,en=t.selectionEnd,arr=await imgs(fs),after={id:uid(),type:'text',text:t.value.slice(en)};b.text=t.value.slice(0,s);p.blocks.splice(i+1,0,...arr,after);active=after.id;touch(p);renderBlocks(p);setTimeout(()=>focus(after.id,0))}async function insertFiles(fs){let p=page(),arr=await imgs(fs);if(!p||!arr.length)return;let i=p.blocks.findIndex(x=>x.id===active);if(i<0)i=p.blocks.length-1;let n={id:uid(),type:'text',text:''};p.blocks.splice(i+1,0,...arr,n);active=n.id;touch(p);renderBlocks(p);setTimeout(()=>focus(n.id,0))}
async function upload(){for(let p of data.pages)for(let b of p.blocks||[])if(b.type==='image'&&b.data&&!b.url){$('#state').textContent='이미지 업로드 중...';let r=await fetch(IMGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.id,data:b.data})});if(!r.ok)throw Error(r.status);let x=await r.json();b.url=x.url;delete b.data}}async function save(){if(saving||!isDirty())return;saving=true;$('#save').disabled=true;try{await upload();data.pages.forEach(p=>{p.body=p.blocks.filter(b=>b.type==='text').map(b=>b.text).join('\n');delete p.images});cache();let r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(r.status);data=await r.json();norm();snapshot=cp(data);cache();dirty(false);$('#state').textContent='GitHub 저장 완료';render()}catch(e){dirty();$('#state').textContent='저장 실패 · 다시 시도'}finally{saving=false}}async function back(){if(isDirty()){if(!confirm('저장하지 않은 변경사항을 버리고 초기 페이지로 돌아갈까요?'))return;if(snapshot){data=cp(snapshot);norm()}dirty(false);cache()}showHome()}
$('#new').onclick=$('#homeNew').onclick=add;$('#brand').onclick=$('#back').onclick=back;$('#save').onclick=save;$('#title').oninput=()=>{let p=page();if(p){p.title=$('#title').value;$('#crumb').textContent=p.title||'제목 없음';touch(p)}};$('#search').oninput=e=>list(e.target.value);$('#menu').onclick=()=>$('#app').classList.toggle('open');$('#attach').onclick=()=>$('#file').click();$('#file').onchange=e=>{insertFiles(e.target.files);e.target.value=''};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='personal-notes-backup.json';a.click()};function theme(){let d=document.documentElement.dataset.theme==='dark';$('#theme').textContent=d?'라이트 모드':'다크 모드'}$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem(THEME,d?'light':'dark');theme()};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';theme();norm();showHome();remoteLoad();
</script></body></html>
