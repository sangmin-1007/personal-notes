<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Notes</title><style>:root{--bg:#fff;--panel:#f7f7f5;--text:#37352f;--muted:#787774;--line:#e9e9e7;--hover:#efefed;--danger:#e03e3e}[data-theme=dark]{--bg:#191919;--panel:#202020;--text:#e6e6e4;--muted:#9b9b98;--line:#333;--hover:#2c2c2c;--danger:#ff7369}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:260px 1fr}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:700;cursor:pointer}.dot{width:24px;height:24px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px}.actions{padding:6px 8px}.sidebtn{width:100%;border:0;background:transparent;border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer}.sidebtn:hover,.row:hover,.row.active{background:var(--hover)}.search{padding:6px 10px}.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;outline:none}.label{padding:12px 14px 5px;color:var(--muted);font-size:12px;font-weight:600}#pages{padding:0 8px;overflow:auto;flex:1}.row{display:flex;align-items:center;border-radius:6px}.select{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.del{opacity:0;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:5px 8px}.row:hover .del{opacity:1}.footer{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px}.footer button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px;cursor:pointer}main{min-width:0;overflow:auto}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;background:var(--bg);z-index:2}.topright,.topleft{display:flex;align-items:center;gap:10px}.crumb{font-size:14px}.state,.meta,.hint{font-size:12px;color:var(--muted)}.savebtn{border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:650}.savebtn:disabled{opacity:.45}.backbtn{border:0;background:transparent;border-radius:7px;padding:7px 9px;cursor:pointer}.editor{max-width:900px;margin:auto;padding:70px 70px 120px}.title{width:100%;border:0;outline:0;background:transparent;font-size:40px;font-weight:750;letter-spacing:-1.2px;padding:0;margin:0 0 8px}.meta{margin-bottom:25px}.blocks{min-height:420px}.block{position:relative;margin:0 0 7px}.textblock{width:100%;min-height:32px;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.8;padding:2px 0;overflow:hidden}.imageblock{margin:14px 0 18px;position:relative}.imageblock img{display:block;max-width:100%;max-height:650px;border-radius:8px;cursor:pointer}.imageblock .remove{position:absolute;top:8px;right:8px;border:0;border-radius:6px;background:#000a;color:#fff;padding:5px 9px;cursor:pointer}.imageblock .after{display:block;margin-top:7px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 0}.toolbar{display:flex;gap:8px;margin-top:18px;align-items:center}.attach{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 11px;cursor:pointer}.home{max-width:900px;margin:auto;padding:90px 70px}.home h1{font-size:34px;margin:0 0 10px}.home p{color:var(--muted);margin:0 0 28px}.home button{border:0;background:var(--text);color:var(--bg);padding:10px 15px;border-radius:8px;cursor:pointer}.hidden{display:none!important}.menu{display:none;border:0;background:transparent;font-size:20px}@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 20% 0 0;z-index:5;box-shadow:8px 0 30px #0003;transform:translateX(-105%);transition:.2s}.app.open aside{transform:none}.editor,.home{padding:48px 24px 90px}.title{font-size:32px}.menu{display:block}.state,.hint{display:none}}</style></head><body><div class="app" id="app"><aside><div class="brand" id="brand"><div class="dot">N</div><span>상민의 메모</span></div><div class="actions"><button class="sidebtn" id="new">＋ 새 페이지</button></div><div class="search"><input id="search" placeholder="페이지 검색..."></div><div class="label">PRIVATE · MANUAL SYNC</div><div id="pages"></div><div class="footer"><button id="export">내보내기</button><button id="theme">다크 모드</button></div></aside><main><div class="top"><div class="topleft"><button class="menu" id="menu">☰</button><button class="backbtn hidden" id="back">← 뒤로가기</button><div class="crumb" id="crumb">Personal Notes</div></div><div class="topright"><div class="state" id="state">불러오는 중...</div><button class="savebtn hidden" id="save" disabled>저장</button></div></div><section class="home" id="home"><h1>상민의 메모</h1><p>왼쪽에서 메모를 선택하거나 새 페이지를 만들어 시작하세요.</p><button id="homeNew">＋ 새 페이지</button></section><section class="editor hidden" id="editor"><input class="title" id="title" placeholder="제목 없음"><div class="meta" id="meta"></div><div class="blocks" id="blocks"></div><div class="toolbar"><button class="attach" id="attach">📎 현재 위치에 이미지</button><span class="hint">글을 쓰다가 이미지 복사 → Ctrl+V → 이미지 아래에서 계속 작성</span><input id="file" type="file" accept="image/*" multiple hidden></div></section></main></div><script>const API='https://personal-notes-api.vercel.app/api/notes',IMGAPI='https://personal-notes-api.vercel.app/api/images',KEY='personal-notes-v1',DIRTY='personal-notes-dirty',THEME='personal-notes-theme',$=s=>document.querySelector(s);let data=local(),current=null,saving=false,serverSnapshot=null,activeBlock=null;function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function seed(){return{current:null,pages:[]}}function clone(x){return JSON.parse(JSON.stringify(x))}function local(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function cache(){data.current=current;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn(e)}}function dirty(v=true){localStorage.setItem(DIRTY,v?'1':'0');$('#save').disabled=!v||saving;$('#state').textContent=v?'저장되지 않은 변경사항':'GitHub와 동기화됨'}function isDirty(){return localStorage.getItem(DIRTY)==='1'}function draft(){cache();dirty(true)}function normalize(){data.pages.forEach(p=>{p.created=p.created||p.updated||Date.now();p.updated=p.updated||p.created;if(!Array.isArray(p.blocks)){p.blocks=[];if(p.body)p.blocks.push({id:uid(),type:'text',text:p.body});(p.images||[]).forEach(im=>p.blocks.push({id:im.id||uid(),type:'image',name:im.name,url:im.url,data:im.data,created:im.created}));if(!p.blocks.length)p.blocks=[{id:uid(),type:'text',text:''}]}})}async function remoteLoad(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error(r.status);let remote=await r.json();serverSnapshot=clone(remote);if(!isDirty())data=remote;normalize();cache();showHome();dirty(isDirty())}catch(e){normalize();showHome();$('#state').textContent='불러오기 실패 · 로컬 데이터 표시'}}function page(){return data.pages.find(p=>p.id===current)}function searchable(p){return(p.title||'')+' '+(p.blocks||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ')}function list(q=''){let box=$('#pages');box.innerHTML='';data.pages.filter(p=>searchable(p).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.updated-a.updated).forEach(p=>{let r=document.createElement('div');r.className='row'+(p.id===current?' active':'');let b=document.createElement('button');b.className='select';b.textContent='📄 '+(p.title.trim()||'제목 없음');b.onclick=()=>{current=p.id;render();$('#app').classList.remove('open')};let d=document.createElement('button');d.className='del';d.textContent='×';d.onclick=e=>{e.stopPropagation();if(confirm('이 페이지를 삭제할까요?')){data.pages=data.pages.filter(x=>x.id!==p.id);draft();if(current===p.id)showHome();else list($('#search').value)}};r.append(b,d);box.append(r)})}function fmt(t){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}function grow(el){el.style.height='auto';el.style.height=Math.max(el.scrollHeight,32)+'px'}function touch(p){p.updated=Date.now();draft();$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;list($('#search').value)}function renderBlocks(p){let root=$('#blocks');root.innerHTML='';p.blocks.forEach((b,i)=>{let wrap=document.createElement('div');wrap.className='block';wrap.dataset.id=b.id;if(b.type==='text'){let t=document.createElement('textarea');t.className='textblock';t.placeholder=i===0?'내용을 입력하세요...':'';t.value=b.text||'';t.onfocus=()=>activeBlock=b.id;t.oninput=()=>{b.text=t.value;touch(p);grow(t)};t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();let pos=t.selectionStart,before=t.value.slice(0,pos),after=t.value.slice(t.selectionEnd);b.text=before;let nb={id:uid(),type:'text',text:after};p.blocks.splice(i+1,0,nb);activeBlock=nb.id;touch(p);renderBlocks(p);setTimeout(()=>focusBlock(nb.id,0),0)}};t.onpaste=e=>pasteIntoText(e,p,b,i,t);wrap.append(t);root.append(wrap);grow(t)}else{wrap.className='imageblock';let img=document.createElement('img');img.src=b.data||b.url;img.alt=b.name||'이미지';img.onclick=()=>window.open(img.src,'_blank');let x=document.createElement('button');x.className='remove';x.textContent='삭제';x.onclick=()=>{p.blocks.splice(i,1);if(!p.blocks.length)p.blocks.push({id:uid(),type:'text',text:''});touch(p);renderBlocks(p)};let a=document.createElement('button');a.className='after';a.textContent='＋ 이미지 아래에 글쓰기';a.onclick=()=>{let nb={id:uid(),type:'text',text:''};p.blocks.splice(i+1,0,nb);activeBlock=nb.id;touch(p);renderBlocks(p);setTimeout(()=>focusBlock(nb.id,0),0)};wrap.append(img,x,a);root.append(wrap)}})}function focusBlock(id,pos){let w=document.querySelector(`[data-id="${id}"] textarea`);if(w){w.focus();let n=pos==null?w.value.length:pos;w.setSelectionRange(n,n)}}function showHome(){current=null;activeBlock=null;$('#editor').classList.add('hidden');$('#home').classList.remove('hidden');$('#back').classList.add('hidden');$('#save').classList.add('hidden');$('#crumb').textContent='Personal Notes';list($('#search').value)}function render(){let p=page();if(!p)return showHome();$('#home').classList.add('hidden');$('#editor').classList.remove('hidden');$('#back').classList.remove('hidden');$('#save').classList.remove('hidden');$('#title').value=p.title||'';$('#crumb').textContent=p.title||'제목 없음';$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;renderBlocks(p);list($('#search').value);$('#save').disabled=!isDirty()||saving}function add(){let now=Date.now(),b={id:uid(),type:'text',text:''},p={id:uid(),title:'',body:'',blocks:[b],created:now,updated:now};data.pages.push(p);current=p.id;activeBlock=b.id;draft();render();$('#title').focus()}function prepImage(file){return new Promise((ok,no)=>{let rd=new FileReader();rd.onerror=no;rd.onload=()=>{let img=new Image();img.onerror=no;img.onload=()=>{let max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.84))};img.src=rd.result};rd.readAsDataURL(file)})}async function imageBlocks(files){let out=[];for(const f of [...files].filter(x=>x&&x.type?.startsWith('image/')))out.push({id:uid(),type:'image',name:f.name||'붙여넣은 이미지',data:await prepImage(f),created:Date.now()});return out}async function pasteIntoText(e,p,b,i,t){let files=Array.from(e.clipboardData?.items||[]).filter(x=>x.type?.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(!files.length)return;e.preventDefault();let start=t.selectionStart,end=t.selectionEnd,before=t.value.slice(0,start),after=t.value.slice(end),imgs=await imageBlocks(files);b.text=before;let insert=[...imgs,{id:uid(),type:'text',text:after}];p.blocks.splice(i+1,0,...insert);activeBlock=insert[insert.length-1].id;touch(p);renderBlocks(p);setTimeout(()=>focusBlock(activeBlock,0),0)}async function insertFiles(files){let p=page();if(!p)return;let imgs=await imageBlocks(files);if(!imgs.length)return;let i=p.blocks.findIndex(b=>b.id===activeBlock);if(i<0)i=p.blocks.length-1;let after={id:uid(),type:'text',text:''};p.blocks.splice(i+1,0,...imgs,after);activeBlock=after.id;touch(p);renderBlocks(p);setTimeout(()=>focusBlock(after.id,0),0)}async function uploadPending(){for(const p of data.pages)for(const b of p.blocks||[])if(b.type==='image'&&b.data&&!b.url){$('#state').textContent='이미지 업로드 중...';let r=await fetch(IMGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.id,data:b.data})});if(!r.ok)throw Error('image '+r.status);let x=await r.json();b.url=x.url;delete b.data}}async function remoteSave(){if(saving||!isDirty())return;saving=true;$('#save').disabled=true;try{await uploadPending();data.pages.forEach(p=>{p.body=(p.blocks||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');delete p.images});cache();let r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(r.status);data=await r.json();normalize();serverSnapshot=clone(data);cache();dirty(false);$('#state').textContent='GitHub 저장 완료';render()}catch(e){dirty(true);$('#state').textContent='저장 실패 · 다시 시도';console.error(e)}finally{saving=false}}async function discardAndHome(){if(isDirty()){if(!confirm('저장하지 않은 변경사항을 버리고 초기 페이지로 돌아갈까요?'))return;if(serverSnapshot){data=clone(serverSnapshot);normalize()}dirty(false);cache()}showHome()}$('#new').onclick=add;$('#homeNew').onclick=add;$('#brand').onclick=discardAndHome;$('#back').onclick=discardAndHome;$('#save').onclick=remoteSave;$('#title').oninput=()=>{let p=page();if(p){p.title=$('#title').value;$('#crumb').textContent=p.title||'제목 없음';touch(p)}};$('#search').oninput=e=>list(e.target.value);$('#menu').onclick=()=>$('#app').classList.toggle('open');$('#attach').onclick=()=>$('#file').click();$('#file').onchange=e=>{insertFiles(e.target.files);e.target.value=''};function themeLabel(){$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'라이트 모드':'다크 모드'}$('#theme').onclick=()=>{let dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME,dark?'light':'dark');themeLabel()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-notes-backup.json';a.click();URL.revokeObjectURL(a.href)};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';themeLabel();normalize();showHome();remoteLoad();</script></body></html>
