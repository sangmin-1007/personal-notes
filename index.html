<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Notes</title>
<style>:root{--bg:#fff;--panel:#f7f7f5;--text:#37352f;--muted:#787774;--line:#e9e9e7;--hover:#efefed;--danger:#e03e3e}[data-theme=dark]{--bg:#191919;--panel:#202020;--text:#e6e6e4;--muted:#9b9b98;--line:#333;--hover:#2c2c2c;--danger:#ff7369}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:260px 1fr}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:700}.dot{width:24px;height:24px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px}.actions{padding:6px 8px}.sidebtn{width:100%;border:0;background:transparent;border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer}.sidebtn:hover{background:var(--hover)}.search{padding:6px 10px}.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;outline:none}.label{padding:12px 14px 5px;color:var(--muted);font-size:12px;font-weight:600}#pages{padding:0 8px;overflow:auto;flex:1}.row{display:flex;align-items:center;border-radius:6px}.row:hover,.row.active{background:var(--hover)}.select{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.del{opacity:0;border:0;background:transparent;cursor:pointer;color:var(--muted);padding:5px 8px}.row:hover .del{opacity:1}.del:hover{color:var(--danger)}.footer{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px}.footer button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px;cursor:pointer}main{min-width:0;overflow:auto}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;background:var(--bg);z-index:2}.topright{display:flex;align-items:center;gap:12px}.crumb{font-size:14px}.state{font-size:12px;color:var(--muted)}.savebtn{border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:650}.savebtn:disabled{opacity:.45;cursor:default}.editor{max-width:900px;margin:auto;padding:70px 70px 120px}.title{width:100%;border:0;outline:0;background:transparent;font-size:40px;font-weight:750;letter-spacing:-1.2px;padding:0;margin:0 0 8px}.meta{font-size:12px;color:var(--muted);margin-bottom:24px}.body{width:100%;min-height:45vh;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.8;padding:0;overflow:hidden}.toolbar{display:flex;gap:8px;margin:14px 0 18px;align-items:center}.attach{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 11px;cursor:pointer}.pastehint{font-size:12px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}.pic{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}.pic img{width:100%;height:180px;object-fit:cover;display:block}.pic button{position:absolute;right:7px;top:7px;border:0;border-radius:6px;background:#000a;color:#fff;padding:4px 8px;cursor:pointer}.empty{height:calc(100vh - 52px);display:grid;place-items:center;color:var(--muted);text-align:center}.empty button{margin-top:12px;border:0;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:7px}.hidden{display:none!important}.menu{display:none;border:0;background:transparent;font-size:20px}@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 20% 0 0;z-index:5;box-shadow:8px 0 30px #0003;transform:translateX(-105%);transition:.2s}.app.open aside{transform:none}.editor{padding:48px 24px 90px}.title{font-size:32px}.menu{display:block}.state{display:none}.pastehint{display:none}}</style></head><body>
<div class="app" id="app"><aside><div class="brand"><div class="dot">N</div><span>상민의 메모</span></div><div class="actions"><button class="sidebtn" id="new">＋ 새 페이지</button></div><div class="search"><input id="search" placeholder="페이지 검색..."></div><div class="label">PRIVATE · MANUAL SYNC</div><div id="pages"></div><div class="footer"><button id="export">내보내기</button><button id="theme">다크 모드</button></div></aside><main><div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="menu" id="menu">☰</button><div class="crumb" id="crumb">Personal Notes</div></div><div class="topright"><div class="state" id="state">불러오는 중...</div><button class="savebtn" id="save" disabled>저장</button></div></div><section class="editor" id="editor"><input class="title" id="title" placeholder="제목 없음"><div class="meta" id="meta"></div><textarea class="body" id="body" placeholder="내용을 입력하세요... (이미지는 Ctrl+V로 붙여넣기 가능)"></textarea><div class="toolbar"><button class="attach" id="attach">📎 이미지/사진 첨부</button><span class="pastehint">또는 본문에서 이미지 Ctrl+V</span><input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div class="gallery" id="gallery"></div></section><section class="empty hidden" id="empty"><div>페이지가 없습니다.<br><button id="emptyNew">새 페이지 만들기</button></div></section></main></div>
<script>
const API='https://personal-notes-api.vercel.app/api/notes',IMGAPI='https://personal-notes-api.vercel.app/api/images',KEY='personal-notes-v1',DIRTY='personal-notes-dirty',THEME='personal-notes-theme',$=s=>document.querySelector(s);let data=local(),current=data.current||data.pages[0]?.id||null,saving=false;function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function seed(){return{current:null,pages:[]}}function local(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function cache(){data.current=current;localStorage.setItem(KEY,JSON.stringify(data))}function isDirty(){return localStorage.getItem(DIRTY)==='1'}function setDirty(v){localStorage.setItem(DIRTY,v?'1':'0');$('#save').disabled=!v||saving;$('#state').textContent=v?'저장되지 않은 변경사항':'GitHub와 동기화됨'}function draft(){cache();setDirty(true)}function normalize(){data.pages.forEach(p=>{p.images=Array.isArray(p.images)?p.images:[];p.created=p.created||p.updated||Date.now();p.updated=p.updated||p.created})}async function remoteLoad(){if(isDirty()){normalize();$('#state').textContent='저장되지 않은 변경사항';$('#save').disabled=false;render();return}try{$('#state').textContent='GitHub에서 불러오는 중...';let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();normalize();current=data.current||data.pages[0]?.id||null;cache();render();setDirty(false)}catch(e){normalize();render();$('#state').textContent='불러오기 실패 · 로컬 데이터 표시';console.error(e)}}async function uploadPending(){for(const p of data.pages)for(const im of p.images||[])if(im.data&&!im.url){$('#state').textContent='이미지 업로드 중...';let r=await fetch(IMGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:im.id,data:im.data})});if(!r.ok)throw Error('image '+r.status);let x=await r.json();im.url=x.url;delete im.data}}async function remoteSave(){if(saving||!isDirty())return;saving=true;$('#save').disabled=true;$('#state').textContent='GitHub에 저장 중...';cache();try{await uploadPending();cache();let r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();normalize();current=data.current||current;cache();localStorage.setItem(DIRTY,'0');$('#state').textContent='GitHub 저장 완료';$('#save').disabled=true;render()}catch(e){localStorage.setItem(DIRTY,'1');$('#state').textContent='저장 실패 · 다시 시도';$('#save').disabled=false;console.error(e)}finally{saving=false}}function page(){return data.pages.find(p=>p.id===current)}function list(q=''){let box=$('#pages');box.innerHTML='';data.pages.filter(p=>(p.title||'제목 없음').toLowerCase().includes(q.toLowerCase())||(p.body||'').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.updated-a.updated).forEach(p=>{let r=document.createElement('div');r.className='row'+(p.id===current?' active':'');let b=document.createElement('button');b.className='select';b.textContent='📄 '+(p.title.trim()||'제목 없음');b.onclick=()=>{current=p.id;cache();render();$('#app').classList.remove('open')};let d=document.createElement('button');d.className='del';d.textContent='×';d.onclick=e=>{e.stopPropagation();if(confirm('이 페이지를 삭제할까요?\nGitHub에는 저장 버튼을 눌러야 반영됩니다.')){data.pages=data.pages.filter(x=>x.id!==p.id);if(current===p.id)current=data.pages[0]?.id||null;draft();render()}};r.append(b,d);box.append(r)})}function grow(){let b=$('#body');b.style.height='auto';b.style.height=Math.max(b.scrollHeight,420)+'px'}function fmt(t){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}function renderGallery(p){let g=$('#gallery');g.innerHTML='';(p.images||[]).forEach(im=>{let d=document.createElement('div');d.className='pic';let img=document.createElement('img');img.src=im.data||im.url;img.alt=im.name||'첨부 이미지';img.onclick=()=>window.open(img.src,'_blank');let x=document.createElement('button');x.textContent='삭제';x.onclick=()=>{p.images=p.images.filter(v=>v.id!==im.id);p.updated=Date.now();draft();render()};d.append(img,x);g.append(d)})}function render(){let p=page();$('#editor').classList.toggle('hidden',!p);$('#empty').classList.toggle('hidden',!!p);if(p){$('#title').value=p.title;$('#body').value=p.body;$('#crumb').textContent=p.title||'제목 없음';$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;renderGallery(p);grow()}else $('#crumb').textContent='Personal Notes';list($('#search').value)}function add(){let now=Date.now(),p={id:uid(),title:'',body:'',images:[],created:now,updated:now};data.pages.push(p);current=p.id;draft();render();$('#title').focus()}function change(){let p=page();if(!p)return;p.title=$('#title').value;p.body=$('#body').value;p.updated=Date.now();$('#crumb').textContent=p.title||'제목 없음';$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;draft();list($('#search').value);grow()}async function prepImage(file){return new Promise((ok,no)=>{let rd=new FileReader();rd.onerror=no;rd.onload=()=>{let img=new Image();img.onerror=no;img.onload=()=>{let max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.84))};img.src=rd.result};rd.readAsDataURL(file)})}async function addImages(files){let p=page();if(!p||!files.length)return;$('#state').textContent='이미지 준비 중...';for(const f of files){try{let dataUrl=await prepImage(f);p.images.push({id:uid(),name:f.name||'붙여넣은 이미지',data:dataUrl,created:Date.now()})}catch(e){console.error(e)}}p.updated=Date.now();draft();render()}function pastedImages(e){let files=[...(e.clipboardData?.items||[])].filter(x=>x.kind==='file'&&x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(!files.length)return;e.preventDefault();addImages(files)}$('#new').onclick=add;$('#emptyNew').onclick=add;$('#save').onclick=remoteSave;$('#title').oninput=change;$('#body').oninput=change;$('#body').onpaste=pastedImages;$('#search').oninput=e=>list(e.target.value);$('#menu').onclick=()=>$('#app').classList.toggle('open');$('#attach').onclick=()=>$('#file').click();$('#file').onchange=e=>{addImages([...e.target.files]);e.target.value=''};function themeLabel(){$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'라이트 모드':'다크 모드'}$('#theme').onclick=()=>{let dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem(THEME,dark?'light':'dark');themeLabel()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-notes-backup.json';a.click();URL.revokeObjectURL(a.href)};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';themeLabel();normalize();render();remoteLoad();
</script></body></html>
