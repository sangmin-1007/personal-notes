<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Notes</title><style>:root{--bg:#fff;--panel:#f7f7f5;--text:#37352f;--muted:#787774;--line:#e9e9e7;--hover:#efefed}[data-theme=dark]{--bg:#191919;--panel:#202020;--text:#e6e6e4;--muted:#9b9b98;--line:#333;--hover:#2c2c2c}*{box-sizing:border-box}html,body{height:100%;margin:0}body,button,input,select{font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:var(--text)}body{background:var(--bg)}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:260px 1fr}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{height:52px;padding:0 14px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}.dot{width:24px;height:24px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center}.actions,.search{padding:6px 8px}.sidebtn,.select,.del{border:0;background:transparent}.sidebtn{width:100%;padding:8px 10px;text-align:left;border-radius:6px}.sidebtn:hover,.row:hover,.row.active{background:var(--hover)}.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:0}.label{padding:12px 14px 5px;font-size:12px;color:var(--muted)}#pages{padding:0 8px;overflow:auto;flex:1}.row{display:flex;border-radius:6px}.select{flex:1;text-align:left;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.del{padding:5px 8px;color:var(--muted);opacity:0}.row:hover .del{opacity:1}.footer{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px}.footer button{flex:1;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}main{overflow:auto}.top{height:52px;position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.topleft,.topright{display:flex;align-items:center;gap:10px}.state,.meta,.hint{font-size:12px;color:var(--muted)}.savebtn{border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:7px;padding:7px 13px;font-weight:650}.savebtn:disabled{opacity:.45}.backbtn{border:0;background:transparent;padding:7px 9px}.editor,.home{max-width:900px;margin:auto;padding:70px 70px 120px}.title{width:100%;border:0;outline:0;background:transparent;font-size:40px;font-weight:750;padding:0;margin-bottom:8px}.meta{margin-bottom:16px}.formatbar{position:sticky;top:52px;z-index:3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;margin:0 0 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.formatbar button,.formatbar select{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 9px}.formatbar button{min-width:32px;font-weight:700}.formatbar button:hover,.formatbar select:hover{background:var(--hover)}.italic{font-style:italic}.underline{text-decoration:underline}.strike{text-decoration:line-through}.colorpick{width:34px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px}.blocks{min-height:420px}.block{margin:0}.richblock{width:100%;min-height:25px;outline:0;background:transparent;font-size:16px;line-height:25px;white-space:pre-wrap;overflow-wrap:anywhere;padding:0;margin:0;font-family:"Malgun Gothic","맑은 고딕",sans-serif}.richblock:empty:before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}.imageblock{position:relative;margin:14px 0 18px}.imageblock img{display:block;max-width:100%;max-height:650px;border-radius:8px}.remove{position:absolute;right:8px;top:8px;border:0;border-radius:6px;background:#000a;color:#fff;padding:5px 9px}.after{display:block;border:0;background:transparent;color:var(--muted);padding:7px 0}.toolbar{display:flex;gap:8px;align-items:center;margin-top:18px}.attach{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 11px}.home #homeNew{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:8px 12px;font-weight:600}.home #homeNew:hover{background:var(--hover)}.home h1{font-size:34px;margin-bottom:10px}.home p{color:var(--muted)}.hidden{display:none!important}.menu{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 20% 0 0;z-index:5;transform:translateX(-105%);background:var(--panel)}.app.open aside{transform:none}.editor,.home{padding:48px 24px}.menu{display:block}.state,.hint{display:none}.formatbar{top:52px}}</style></head><body><div class="app" id="app"><aside><div class="brand" id="brand"><div class="dot">N</div>상민의 메모</div><div class="actions"><button class="sidebtn" id="new">＋ 새 페이지</button></div><div class="search"><input id="search" placeholder="페이지 검색..."></div><div class="label">PRIVATE · MANUAL SYNC</div><div id="pages"></div><div class="footer"><button id="export">내보내기</button><button id="theme">다크 모드</button></div></aside><main><div class="top"><div class="topleft"><button class="menu" id="menu">☰</button><button class="backbtn hidden" id="back">← 뒤로가기</button><span id="crumb">Personal Notes</span></div><div class="topright"><span class="state" id="state">불러오는 중...</span><button class="savebtn hidden" id="save" disabled>저장</button></div></div><section class="home" id="home"><h1>상민의 메모</h1><p>왼쪽에서 메모를 선택하거나 새 페이지를 만들어 시작하세요.</p><button id="homeNew">＋ 새 페이지</button></section><section class="editor hidden" id="editor"><input class="title" id="title" placeholder="제목 없음"><div class="meta" id="meta"></div><div class="formatbar" id="formatbar"><select id="fontName" title="글꼴"><option value="">글꼴</option><option value="Malgun Gothic">맑은 고딕</option><option value="Gulim">굴림</option><option value="Dotum">돋움</option><option value="Batang">바탕</option><option value="Gungsuh">궁서</option><option value="Arial">Arial (영문)</option><option value="Georgia">Georgia (영문)</option><option value="monospace">고정폭</option></select><select id="fontSize" title="글자 크기"><option value="">크기</option><option value="12">12</option><option value="14">14</option><option value="16">16</option><option value="18">18</option><option value="20">20</option><option value="24">24</option><option value="28">28</option><option value="32">32</option></select><button data-cmd="bold">B</button><button data-cmd="italic" class="italic">I</button><button data-cmd="underline" class="underline">U</button><button data-cmd="strikeThrough" class="strike">S</button><input class="colorpick" id="foreColor" type="color" value="#e6e6e4"><button id="clearFormat">Tx</button></div><div class="blocks" id="blocks"></div><div class="toolbar"><button class="attach" id="attach">📎 현재 위치에 이미지</button><span class="hint">글자 선택 후 서식 적용 · Enter 줄바꿈 · Ctrl+V 이미지 삽입</span><input id="file" type="file" accept="image/*" multiple hidden></div></section></main></div><script>
const API='https://personal-notes-api.vercel.app/api/notes',IMGAPI='https://personal-notes-api.vercel.app/api/images',KEY='personal-notes-v1',DIRTY='personal-notes-dirty',THEME='personal-notes-theme',$=s=>document.querySelector(s);let data=load(),current=null,saving=false,snapshot=null,active=null,savedRange=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function load(){try{return JSON.parse(localStorage.getItem(KEY))||{pages:[]}}catch{return{pages:[]}}}function cp(x){return JSON.parse(JSON.stringify(x))}function cache(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function isDirty(){return localStorage.getItem(DIRTY)==='1'}function dirty(v=true){localStorage.setItem(DIRTY,v?'1':'0');$('#save').disabled=!v||saving;$('#state').textContent=v?'저장되지 않은 변경사항':'GitHub와 동기화됨'}function esc(s=''){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function textToHtml(s=''){return esc(s).replace(/\n/g,'<br>')}function plain(h=''){let d=document.createElement('div');d.innerHTML=h;return d.innerText.replace(/\u00a0/g,' ')}function norm(){(data.pages||=[]).forEach(p=>{p.created=p.created||p.updated||Date.now();p.updated=p.updated||p.created;if(!Array.isArray(p.blocks)){p.blocks=[];if(p.body)p.blocks.push({id:uid(),type:'text',text:p.body,html:textToHtml(p.body)});(p.images||[]).forEach(x=>p.blocks.push({...x,id:x.id||uid(),type:'image'}));if(!p.blocks.length)p.blocks=[{id:uid(),type:'text',text:'',html:''}]}p.blocks.forEach(b=>{if(b.type==='text'&&b.html==null)b.html=textToHtml(b.text||'')})})}function page(){return data.pages.find(x=>x.id===current)}function touch(p){p.updated=Date.now();cache();dirty();$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;list($('#search').value)}function fmt(t){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}
async function remoteLoad(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error(r.status);let x=await r.json();snapshot=cp(x);if(!isDirty())data=x;norm();cache();showHome();dirty(isDirty())}catch(e){norm();showHome();$('#state').textContent='불러오기 실패 · 로컬 데이터 표시'}}
function searchText(p){return(p.title||'')+' '+p.blocks.filter(x=>x.type==='text').map(x=>x.text||plain(x.html||'')).join(' ')}function list(q=''){let box=$('#pages');box.innerHTML='';data.pages.filter(p=>searchText(p).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.updated-a.updated).forEach(p=>{let r=document.createElement('div');r.className='row'+(p.id===current?' active':'');let b=document.createElement('button');b.className='select';b.textContent='📄 '+(p.title||'제목 없음');b.onclick=()=>{current=p.id;render()};let d=document.createElement('button');d.className='del';d.textContent='×';d.onclick=e=>{e.stopPropagation();if(confirm('이 페이지를 삭제할까요?')){data.pages=data.pages.filter(x=>x.id!==p.id);touch(p);current===p.id?showHome():list(q)}};r.append(b,d);box.append(r)})}
function syncRich(el,b,p){b.html=el.innerHTML;b.text=el.innerText.replace(/\u00a0/g,' ');touch(p)}function richFromNode(n){return(n?.nodeType===1?n:n?.parentElement)?.closest?.('.richblock')}function rememberSelection(){let s=getSelection();if(s.rangeCount&&richFromNode(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange()}function restoreSelection(){if(!savedRange)return false;let s=getSelection();s.removeAllRanges();s.addRange(savedRange);return true}function syncSelected(){let el=richFromNode(getSelection().anchorNode);if(el){let p=page(),b=p?.blocks.find(x=>x.id===el.dataset.bid);if(b)syncRich(el,b,p)}}function format(cmd,val=null){if(!restoreSelection())return;document.execCommand(cmd,false,val);syncSelected();rememberSelection()}function applyStyle(prop,val){if(!restoreSelection())return;let s=getSelection();if(!s.rangeCount)return;let r=s.getRangeAt(0);if(r.collapsed)return;let span=document.createElement('span');span.style[prop]=val;try{r.surroundContents(span)}catch{let frag=r.extractContents();span.appendChild(frag);r.insertNode(span)}s.removeAllRanges();let nr=document.createRange();nr.selectNodeContents(span);s.addRange(nr);savedRange=nr.cloneRange();syncSelected()}
function renderBlocks(p){let root=$('#blocks');root.innerHTML='';p.blocks.forEach((b,i)=>{if(b.type==='text'){let w=document.createElement('div');w.className='block';let e=document.createElement('div');e.className='richblock';e.contentEditable='true';e.dataset.bid=b.id;e.dataset.placeholder=i===0?'내용을 입력하세요...':'';e.innerHTML=b.html||textToHtml(b.text||'');e.onfocus=()=>active=b.id;e.oninput=()=>syncRich(e,b,p);e.onkeyup=rememberSelection;e.onmouseup=rememberSelection;e.onpaste=ev=>pasteImage(ev,p,b,i,e);w.append(e);root.append(w)}else{let w=document.createElement('div');w.className='imageblock';let img=document.createElement('img');img.src=b.data||b.url;img.onclick=()=>window.open(img.src,'_blank');let x=document.createElement('button');x.className='remove';x.textContent='삭제';x.onclick=()=>{p.blocks.splice(i,1);if(!p.blocks.length)p.blocks=[{id:uid(),type:'text',text:'',html:''}];touch(p);renderBlocks(p)};let a=document.createElement('button');a.className='after';a.textContent='＋ 이미지 아래에 글쓰기';a.onclick=()=>{let n={id:uid(),type:'text',text:'',html:''};p.blocks.splice(i+1,0,n);active=n.id;touch(p);renderBlocks(p);setTimeout(()=>document.querySelector(`[data-bid="${n.id}"]`)?.focus())};w.append(img,x,a);root.append(w)}})}
function showHome(){current=active=null;savedRange=null;$('#editor').classList.add('hidden');$('#home').classList.remove('hidden');$('#back').classList.add('hidden');$('#save').classList.add('hidden');$('#crumb').textContent='Personal Notes';list($('#search').value)}function render(){let p=page();if(!p)return showHome();$('#home').classList.add('hidden');$('#editor').classList.remove('hidden');$('#back').classList.remove('hidden');$('#save').classList.remove('hidden');$('#title').value=p.title||'';$('#crumb').textContent=p.title||'제목 없음';$('#meta').textContent=`작성 ${fmt(p.created)} · 수정 ${fmt(p.updated)}`;renderBlocks(p);list($('#search').value);$('#save').disabled=!isDirty()||saving}function add(){let n=Date.now(),b={id:uid(),type:'text',text:'',html:''},p={id:uid(),title:'',body:'',blocks:[b],created:n,updated:n};data.pages.push(p);current=p.id;active=b.id;touch(p);render();$('#title').focus()}
function prep(f){return new Promise((ok,no)=>{let r=new FileReader;r.onerror=no;r.onload=()=>{let im=new Image;im.onerror=no;im.onload=()=>{let m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.84))};im.src=r.result};r.readAsDataURL(f)})}async function imgs(fs){let a=[];for(let f of [...fs].filter(f=>f.type?.startsWith('image/')))a.push({id:uid(),type:'image',name:f.name||'이미지',data:await prep(f),created:Date.now()});return a}async function pasteImage(e,p,b,i,el){let fs=[...(e.clipboardData?.items||[])].filter(x=>x.type?.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(!fs.length)return;e.preventDefault();syncRich(el,b,p);let arr=await imgs(fs),n={id:uid(),type:'text',text:'',html:''};p.blocks.splice(i+1,0,...arr,n);active=n.id;touch(p);renderBlocks(p);setTimeout(()=>document.querySelector(`[data-bid="${n.id}"]`)?.focus())}async function insertFiles(fs){let p=page(),arr=await imgs(fs);if(!p||!arr.length)return;let i=p.blocks.findIndex(x=>x.id===active);if(i<0)i=p.blocks.length-1;let n={id:uid(),type:'text',text:'',html:''};p.blocks.splice(i+1,0,...arr,n);active=n.id;touch(p);renderBlocks(p)}
async function upload(){for(let p of data.pages)for(let b of p.blocks||[])if(b.type==='image'&&b.data&&!b.url){$('#state').textContent='이미지 업로드 중...';let r=await fetch(IMGAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.id,data:b.data})});if(!r.ok)throw Error(r.status);let x=await r.json();b.url=x.url;delete b.data}}async function save(){if(saving||!isDirty())return;saving=true;$('#save').disabled=true;try{await upload();data.pages.forEach(p=>{p.body=p.blocks.filter(b=>b.type==='text').map(b=>b.text||plain(b.html||'')).join('\n');delete p.images});cache();let r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(r.status);data=await r.json();norm();snapshot=cp(data);cache();dirty(false);$('#state').textContent='GitHub 저장 완료';render()}catch(e){dirty();$('#state').textContent='저장 실패 · 다시 시도'}finally{saving=false}}async function back(){if(isDirty()){if(!confirm('저장하지 않은 변경사항을 버리고 초기 페이지로 돌아갈까요?'))return;if(snapshot){data=cp(snapshot);norm()}dirty(false);cache()}showHome()}
$('#new').onclick=$('#homeNew').onclick=add;$('#brand').onclick=$('#back').onclick=back;$('#save').onclick=save;$('#title').oninput=()=>{let p=page();if(p){p.title=$('#title').value;$('#crumb').textContent=p.title||'제목 없음';touch(p)}};$('#search').oninput=e=>list(e.target.value);$('#menu').onclick=()=>$('#app').classList.toggle('open');$('#attach').onclick=()=>$('#file').click();$('#file').onchange=e=>{insertFiles(e.target.files);e.target.value=''};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='personal-notes-backup.json';a.click()};document.querySelectorAll('#formatbar button[data-cmd]').forEach(b=>b.onmousedown=e=>{e.preventDefault();format(b.dataset.cmd)});$('#fontName').onmousedown=rememberSelection;$('#fontName').onchange=e=>{if(e.target.value)applyStyle('fontFamily',e.target.value);e.target.value=''};$('#fontSize').onmousedown=rememberSelection;$('#fontSize').onchange=e=>{if(e.target.value)applyStyle('fontSize',e.target.value+'px');e.target.value=''};$('#foreColor').onmousedown=rememberSelection;$('#foreColor').oninput=e=>applyStyle('color',e.target.value);$('#clearFormat').onmousedown=e=>{e.preventDefault();format('removeFormat')};function theme(){let d=document.documentElement.dataset.theme==='dark';$('#theme').textContent=d?'라이트 모드':'다크 모드'}$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem(THEME,d?'light':'dark');theme()};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';theme();norm();showHome();remoteLoad();
</script></body></html>
